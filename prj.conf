CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SENSOR=y

# Set system tick to 10kHz to guarantee mathematically exact 1ms (1kHz) hardware timers
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Disable console to prevent it from eating RX interrupts, and enable UART ISR
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=y